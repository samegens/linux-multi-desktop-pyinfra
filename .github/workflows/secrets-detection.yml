name: Secret Detection

on:
  push:
  pull_request:
  # Allow manual trigger
  workflow_dispatch:

jobs:
  gitleaks:
    name: Detect Secrets with Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: |
            gitleaks-report.json
            gitleaks-report.sarif
          retention-days: 30

  trufflehog:
    name: Detect Secrets with TruffleHog
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --results=verified,unknown

  detect-secrets:
    name: Detect Secrets with detect-secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all history for all branches

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets
        run: |
          # Scan and compare with baseline - will fail if new secrets found
          detect-secrets scan --baseline .secrets.baseline > /tmp/scan-results.json
          if [ -s /tmp/scan-results.json ]; then
            echo "New secrets detected!"
            cat /tmp/scan-results.json
            exit 1
          fi

      - name: Upload detect-secrets report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: detect-secrets-report
          path: /tmp/scan-results.json
          retention-days: 30
